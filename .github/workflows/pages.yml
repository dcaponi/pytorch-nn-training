name: Deploy book to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# allow the workflow to publish Pages, and let one deployment finish before the next
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # build.py is standard-library only, so there is nothing to install
      - name: Build the book
        run: python3 book/build.py

      - name: Fail if any cross-reference is dangling
        run: python3 book/build.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test the single-page app
        working-directory: book/test
        run: |
          npm install --no-fund --no-audit
          npm test

      - name: Prepare the artifact
        run: |
          mkdir -p _site
          cp -R book/index.html book/vendor _site/
          # GitHub Pages runs Jekyll by default, which would skip our _ prefixed
          # paths and rewrite things we do not want rewritten
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
